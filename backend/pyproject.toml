[project]
name = "mario-agent"
version = "0.1.0"
description = "Mario voice agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "google-genai==2.34.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "screen-brightness-control==0.27.2",
    "google-auth-oauthlib==1.5.0",
    "pycaw==20260927; sys_platform == 'win32'",
    "comtypes==1.4.17; sys_platform == 'win32'",
    "winrt-runtime==4.1.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==4!10.0.28000.2957; sys_platform == 'win32'",
    "google-adk==2.14.0",
    "pypdf==7.0.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.3.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 is FastAPI's Depends()/Header() in parameter defaults.
# B904: HTTP errors are raised after the original exception is logged.
# B905: zip() of equal-length pairs; strict would not change the result.
ignore = ["E501", "B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"evals/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
