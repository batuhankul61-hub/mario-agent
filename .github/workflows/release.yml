name: Release

# Pushing a tag like v0.1.0 builds Mario.exe and attaches the zip to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist\*.zip).FullName --title "Mario ${{ github.ref_name }}" --generate-notes
