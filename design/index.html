<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mario · tasarım seçenekleri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap">
  <style>
    :root { color-scheme: light; --bg: #e9e9ee; --fg: #111; --dim: #5f5f66; --line: rgb(0 0 0 / .1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, "Inter", system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #f7f7f9; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .seg { display: flex; padding: 3px; border-radius: 10px; background: rgb(0 0 0 / .06); }
    .seg button { min-height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: none; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
    .about { flex-basis: 100%; margin: 0; color: var(--dim); font-size: 14px; }
    .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 20px; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 14px; background: #fff; box-shadow: 0 20px 50px -20px rgb(0 0 0 / .35), 0 0 0 1px var(--line); }
    .phone iframe { width: 390px; height: min(100%, 844px); border-radius: 44px; box-shadow: 0 20px 50px -20px rgb(0 0 0 / .45), 0 0 0 10px #1c1c1e; }
  </style>
</head>
<body>
  <header>
    <h1>Mario · tasarım seçenekleri</h1>
    <div class="seg" id="concepts">
      <button data-src="a-kenar-isigi.html" aria-pressed="true">A · Kenar ışığı</button>
      <button data-src="b-odak.html" aria-pressed="false">B · Odak</button>
      <button data-src="c-uygulama.html" aria-pressed="false">C · Uygulama</button>
    </div>
    <div class="seg" id="device">
      <button data-device="desktop" aria-pressed="true">Masaüstü</button>
      <button data-device="phone" aria-pressed="false">Telefon</button>
    </div>
    <p class="about" id="about"></p>
  </header>
  <div class="stage"><iframe id="frame" title="Tasarım önizlemesi"></iframe></div>

  <script>
    const ABOUT = {
      "a-kenar-isigi.html": "Siri gibi: konuşma ortada akar, sonuçlar zengin kartlar olarak gelir (hava, mail). Sen konuşurken ekranın kenarları renkli ışıkla parlar. Altta yüzen cam bir giriş çubuğu.",
      "b-odak.html": "Sese odaklı: ortada büyük bir ışık küresi, altında sadece son cümle büyük harflerle. Geçmiş alttan açılan bir sayfada. Telefon görüşmesi gibi büyük yuvarlak düğmeler.",
      "c-uygulama.html": "Mac uygulaması gibi: solda buzlu cam kenar çubuğu (Sohbet, Görevler, Yetenekler, Ayarlar), ortada iMessage tarzı balonlar. Telefonda kenar çubuğu alt sekme çubuğuna dönüşür.",
    };
    const frame = document.getElementById("frame");
    const stage = document.querySelector(".stage");
    function pick(group, btn) {
      for (const b of document.querySelectorAll(`#${group} button`)) b.setAttribute("aria-pressed", String(b === btn));
    }
    document.getElementById("concepts").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      pick("concepts", b);
      frame.src = b.dataset.src;
      document.getElementById("about").textContent = ABOUT[b.dataset.src];
    });
    document.getElementById("device").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      pick("device", b);
      stage.classList.toggle("phone", b.dataset.device === "phone");
    });
    document.querySelector("#concepts button").click();
  </script>
</body>
</html>
